name: build-client

on:
  push:
    branches: [main, 'hack-0.2.8-sty\+ct\+ap', "rcl/**"]
    tags: ['v0.2.9\+sty\+ct\+ap\+rcl.*']
  pull_request:
    branches: [main, 'hack-0.2.8-sty\+ct\+ap', "rcl/**"]
  workflow_dispatch:

jobs:
  validate-ref:
    runs-on: ubuntu-22.04
    steps:
      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v0\.2\.9\+sty\+ct\+ap\+rcl\.[0-9]+$ ]]; then
            echo "Invalid RCL release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi

  build-macos:
    needs: validate-ref
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Build macOS client
        run: bash build-macos.sh

      - name: Smoke client
        run: |
          EXPECTED_VERSION="$(sh batch/make/version .)"
          CLIENT_BIN=src/armagetronad_main \
            EXPECTED_VERSION="$EXPECTED_VERSION" \
            bash scripts/smoke-client.sh

      - name: Package macOS app
        run: |
          VERSION="$(sh batch/make/version .)"
          bash scripts/package-macos-app.sh \
            --binary src/armagetronad_main \
            --version "$VERSION" \
            --bundle-build "$GITHUB_RUN_NUMBER" \
            --out-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: client-macos-arm64
          path: dist/Retrocycles-RCL-*-macos-arm64.zip*

  build-linux:
    needs: validate-ref
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bison g++ libgl1-mesa-dev libglew-dev libpng-dev \
            libsdl-image1.2-dev libsdl-mixer1.2-dev libsdl1.2-dev libtool \
            libxml2-dev libzthread-dev make pkg-config python3 wget

      - name: Build Linux client
        run: bash scripts/build-linux-client.sh

      - name: Smoke client
        run: |
          EXPECTED_VERSION="$(sh batch/make/version .)"
          EXPECTED_VERSION="$EXPECTED_VERSION" bash scripts/smoke-client.sh

      - name: Package Linux tarball
        run: |
          VERSION="$(sh batch/make/version .)"
          bash scripts/package-client.sh \
            --binary build-client/src/armagetronad_main \
            --platform linux-x86_64 \
            --version "$VERSION" \
            --out-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: client-linux-x86_64
          path: dist/Retrocycles-RCL-*.tar.gz*

  build-windows:
    needs: validate-ref
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            autoconf
            automake
            libtool
            pkg-config
            bison
            make
            curl
            git
            python
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-SDL
            mingw-w64-x86_64-SDL_image
            mingw-w64-x86_64-SDL_mixer
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-glew

      - name: Build Windows client
        run: bash scripts/build-windows-client.sh

      - name: Smoke client (version string)
        run: |
          BIN="build-client/src/armagetronad_main.exe"
          test -f "$BIN" || BIN="build-client/src/armagetronad_main"
          EXPECTED_VERSION="$(sh batch/make/version .)"
          CLIENT_BIN="$BIN" EXPECTED_VERSION="$EXPECTED_VERSION" \
            bash scripts/smoke-client.sh

      - name: Package Windows tarball
        run: |
          VERSION="$(sh batch/make/version .)"
          BIN="build-client/src/armagetronad_main.exe"
          test -f "$BIN" || BIN="build-client/src/armagetronad_main"
          bash scripts/package-client.sh \
            --binary "$BIN" \
            --platform windows-x86_64 \
            --version "$VERSION" \
            --out-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: client-windows-x86_64
          path: dist/Retrocycles-RCL-*.tar.gz*

  release:
    if: startsWith(github.ref, 'refs/tags/v0.2.9+sty+ct+ap+rcl.')
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          generate_release_notes: true
          files: artifacts/**
