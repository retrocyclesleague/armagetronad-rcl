name: build-dedicated

on:
  push:
    branches: [main, 'hack-0.2.8-sty\+ct\+ap', "rcl/**"]
    tags: ['v0.2.9\+sty\+ct\+ap\+rcl.*']
  pull_request:
    branches: [main, 'hack-0.2.8-sty\+ct\+ap', "rcl/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v0\.2\.9\+sty\+ct\+ap\+rcl\.[0-9]+$ ]]; then
            echo "Invalid RCL release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bison bzip2 g++ libtool libxml2-dev \
            libzthread-dev make pkg-config python3 wget

      - name: Bootstrap and build dedicated server
        run: bash .cursor/scripts/cloud-agent-install.sh

      - name: Smoke dedicated server
        run: bash scripts/smoke-dedicated.sh
