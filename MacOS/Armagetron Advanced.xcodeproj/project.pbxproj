		8C6EF3CA08A3168C00816348 /* Sort Package */ = {
			isa = PBXShellScriptBuildPhase;
			name = "Sort Package";
			shellPath = "/bin/bash -l";
			shellScript = (
				"# Author: Daniel Harple",
				"# Purpose:",
				"# \tGet rid of useless files, and move some files to their correct positions",
				"",
				"target_build=\"${TARGET_BUILD_DIR}/${WRAPPER_NAME}\"",
				"",
				"# Xcode copies this file over to Resources/, not where it belongs.",
				"rm -f \"${target_build}/Contents/Resources/Info.plist\"",
				"",
				"# Move InfoPlist.strings to the correct spot (we should really fix this correctly)",
				"if [ ! -d \"${target_build}/Contents/Resources/English.lproj\" ]",
				"then",
				"\tmkdir \"${target_build}/Contents/Resources/English.lproj\"",
				"\tmv \"${target_build}/Contents/Resources/InfoPlist.strings\" \"${target_build}/Contents/Resources/English.lproj/InfoPlist.strings\"",
				"fi",
				"",
				"# App sometimes loads this icon if it exists, so we remove it.",
				"rm -f \"${target_build}/Contents/Resources/textures/icon.png\"",
				"",
				"# Remove useless files",
				"for a in \"*.am\" \"*.in\" \"*.h\" \"astylerc\" \".cvsignore\"",
				"do",
				"\tfind \"${target_build}/Contents\" -name \"${a}\" -exec rm -f \\{\\} \\;",
				"done",
				"",
				"# Remove the proto/ directory",
				"rm -rf \"${target_build}/Contents/Resources/resource/proto\"",
				"",
				"# Sign the binary manually (workaround for Xcode -no_adhoc_codesign issue)",
				"codesign --force --sign - --timestamp=none --deep \"${target_build}\"",
				"",
			);
		};
