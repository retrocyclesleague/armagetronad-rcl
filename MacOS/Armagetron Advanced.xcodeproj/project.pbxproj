		9B8A49B80D3708A30094FB81 /* ShellScript */ = {
			isa = PBXShellScriptBuildPhase;
			shellPath = /bin/bash;
			shellScript = (
				"TMPDIR=\"${TEMP_FILES_DIR}\"",
				"to_package_dir=$(mktemp -dt armagetronad)",
				"version=$(grep -m1 '#define VERSION' \"../src/macosx/config_common.h\" | sed 's/.*\"\\(.*\\)\".*/\\1/')",
				"final_dmg=\"${BUILT_PRODUCTS_DIR}/armagetronad-dedicated-${version}-macos\"",
				"",
				"test -f \"${final_dmg}.dmg\" && rm \"${final_dmg}.dmg\"",
				"",
				"prog_dir=\"${to_package_dir}/Armagetron Advanced Dedicated\"",
				"mkdir \"${prog_dir}\"",
				"",
				"cp \"${TARGET_BUILD_DIR}/armagetronad-dedicated\" \"${prog_dir}\"",
				"for copy_me in \"../config\" \"../language\" \"../resource\"",
				"do",
				"\tcp -R \"${copy_me}\" \"${prog_dir}\"",
				"done",
				"",
				"rm -rf \"${prog_dir}/resource/proto\"",
				"for a in \"*.am\" \"*.in\" \"*.h\" \"astylerc\"",
				"do",
				"\tfind \"${prog_dir}\" -name \"${a}\" -exec rm -f \\{\\} \\;",
				"done",
				"",
				"uncompressed_dmg=$(./build_tools/dmg-create \"${to_package_dir}\" \"Armagetron Advanced Dedicated\")",
				"",
				"./build_tools/dmg-convert \"${uncompressed_dmg}\" \"${final_dmg}\"",
				"rm \"${uncompressed_dmg}\"",
				"rm -r \"${to_package_dir}\"",
				"",
			);
		};
