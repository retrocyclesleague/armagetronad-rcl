############################################################################################
#
# Keep this header as a reminder and help guide for you and everyone else.
#
# All settings will be loaded when the client is launched (not for dedicated).
#
# The order of loading is as follows
#   user.cfg
#   settings.cfg
#   settings_client.cfg     <- this file
#   moviepack/settings.cfg
#   autoexec.cfg
#
############################################################################################

# Select RCL's detailed floor asset once for classic profiles whose high-detail
# default used the old two-strip grid. RCL_FLOOR_HD_MIGRATED is persisted in
# user.cfg, so later choices in Display Settings are never overwritten.
RCL_APPLY_FLOOR_HD_MIGRATION

# Switch on RCL's pale open arena once for profiles that saved it as off
# while that was briefly the default. RCL_CLEAN_ARENA_APPLIED is persisted in
# user.cfg, so later choices in Display & Graphics are never overwritten.
RCL_APPLY_CLEAN_ARENA

# Bring the sound buffer down once for profiles that saved the old Windows
# default, with which a sound could start up to 46 ms late. Persisted as
# RCL_SOUND_LATENCY_APPLIED; later choices in the sound menu are kept.
RCL_APPLY_SOUND_LATENCY
